<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Roll-out sequence from internal writes to customer replies">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--foreground)); }
    .lbl { font-size: 14px; font-weight: 480; }
    .note { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .mono { font-family: var(--font-mono); font-size: 11px; fill: hsl(var(--muted-foreground)); }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .rail { stroke: hsl(var(--border)); stroke-width: 1; }
    .zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
    .accentbox { fill: none; stroke: hsl(var(--accent)); stroke-width: 1; }
    .pin { fill: hsl(var(--accent)); }
    .pintext { fill: hsl(var(--accent-foreground)); font-size: 11px; font-weight: 600; }
  </style>
  <defs>
    <marker id="chev" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1.2"/>
    </marker>
  </defs>

  <text class="note" x="0" y="12">blast radius →</text>
  <line class="rail" x1="0" y1="20" x2="640" y2="20"/>

  <!-- steps -->
  <rect class="box" x="0"   y="36" width="112" height="58" rx="8"/>
  <text class="lbl"  x="12" y="60">Step 1</text>
  <text class="note" x="12" y="78">Audit + kill switch</text>

  <rect class="box" x="132" y="36" width="112" height="58" rx="8"/>
  <text class="lbl"  x="144" y="60">Step 2</text>
  <text class="note" x="144" y="78">Severity in Triage</text>

  <rect class="box" x="264" y="36" width="112" height="58" rx="8"/>
  <text class="lbl"  x="276" y="60">Step 3</text>
  <text class="note" x="276" y="78">Owner + area</text>

  <rect class="box" x="396" y="36" width="112" height="58" rx="8"/>
  <text class="lbl"  x="408" y="60">Step 4</text>
  <text class="note" x="408" y="78">Internal notes</text>

  <rect class="box" x="528" y="36" width="112" height="58" rx="8"/>
  <text class="lbl"  x="540" y="60">Step 5</text>
  <text class="note" x="540" y="78">Tags + lifecycle</text>

  <line class="wire" x1="112" y1="65" x2="130" y2="65" marker-end="url(#chev)"/>
  <line class="wire" x1="244" y1="65" x2="262" y2="65" marker-end="url(#chev)"/>
  <line class="wire" x1="376" y1="65" x2="394" y2="65" marker-end="url(#chev)"/>
  <line class="wire" x1="508" y1="65" x2="526" y2="65" marker-end="url(#chev)"/>

  <rect class="accentbox" x="0" y="120" width="180" height="58" rx="8"/>
  <text class="lbl"  x="12" y="144">Step 6</text>
  <text class="note" x="12" y="162">Customer replies (last)</text>

  <rect class="box" x="200" y="120" width="180" height="58" rx="8" stroke-dasharray="4 3"/>
  <text class="lbl"  x="212" y="144">Step 7</text>
  <text class="note" x="212" y="162">Authority flip (later)</text>

  <!-- write-through mechanic -->
  <rect class="zone" x="0" y="212" width="640" height="104" rx="8"/>
  <text class="note" x="12" y="232">every write, until step 7</text>

  <rect class="box" x="20"  y="246" width="110" height="48" rx="8"/>
  <text class="lbl" x="34" y="275">ESH action</text>

  <rect class="box" x="180" y="246" width="110" height="48" rx="8"/>
  <text class="lbl" x="200" y="275">Intercom</text>

  <rect class="box" x="340" y="246" width="110" height="48" rx="8"/>
  <text class="lbl" x="358" y="275">re-read</text>

  <rect class="box" x="500" y="246" width="120" height="48" rx="8"/>
  <text class="lbl" x="514" y="275">local row</text>

  <line class="wire" x1="130" y1="270" x2="178" y2="270" marker-end="url(#chev)"/>
  <line class="wire" x1="290" y1="270" x2="338" y2="270" marker-end="url(#chev)"/>
  <line class="wire" x1="450" y1="270" x2="498" y2="270" marker-end="url(#chev)"/>

  <circle class="pin" cx="160" cy="336" r="9"/>
  <text class="pintext" x="157" y="340">1</text>
  <text class="note" x="176" y="340">Intercom rejects → local row untouched, UI shows the error. Never a silent local-only write.</text>

  <circle class="pin" cx="160" cy="366" r="9"/>
  <text class="pintext" x="157" y="370">2</text>
  <text class="note" x="176" y="370">Every step ships with a negative test: kill switch off, prove the write does not happen.</text>
</svg>
