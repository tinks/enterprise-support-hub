<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Feedback loop from proposal through human decision to rubric change, gated by a backtest">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--foreground)); }
    .lbl { font-size: 14px; font-weight: 480; }
    .sm { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; rx: 8; }
    .acc { fill: none; stroke: hsl(var(--accent)); stroke-width: 1; rx: 8; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; marker-end: url(#c); }
    .wired { stroke: hsl(var(--accent)); stroke-width: 1; fill: none; marker-end: url(#ca); }
    .zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; rx: 8; }
    .halo { paint-order: stroke; stroke: hsl(var(--background)); stroke-width: 4px; }
  </style>
  <defs>
    <marker id="c" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
    <marker id="ca" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7" fill="none" stroke="hsl(var(--accent))" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="box" x="16" y="24" width="140" height="56"/>
  <text class="lbl" x="86" y="48" text-anchor="middle">AI proposal</text>
  <text class="sm" x="86" y="66" text-anchor="middle">rubric + 12 examples</text>

  <rect class="box" x="216" y="24" width="150" height="56"/>
  <text class="lbl" x="291" y="48" text-anchor="middle">Human decides</text>
  <text class="sm" x="291" y="66" text-anchor="middle">accept / set other value</text>

  <rect class="acc" x="426" y="24" width="196" height="56"/>
  <text class="lbl" x="524" y="48" text-anchor="middle">Reason on disagreement</text>
  <text class="sm" x="524" y="66" text-anchor="middle">code + one-line why (new)</text>

  <line class="wire" x1="156" y1="52" x2="212" y2="52"/>
  <line class="wired" x1="366" y1="52" x2="422" y2="52"/>

  <rect class="acc" x="336" y="140" width="286" height="60"/>
  <text class="lbl" x="479" y="164" text-anchor="middle">Labeled decision corpus</text>
  <text class="sm" x="479" y="182" text-anchor="middle">ticket text + AI call + final severity + why</text>
  <line class="wired" x1="524" y1="80" x2="524" y2="136"/>

  <rect class="box" x="336" y="252" width="286" height="60"/>
  <text class="lbl" x="479" y="276" text-anchor="middle">Backtest a rubric draft</text>
  <text class="sm" x="479" y="294" text-anchor="middle">re-score past tickets, agreement before/after</text>
  <line class="wire" x1="479" y1="200" x2="479" y2="248"/>

  <rect class="box" x="16" y="252" width="240" height="60"/>
  <text class="lbl" x="136" y="276" text-anchor="middle">Rubric v(n+1)</text>
  <text class="sm" x="136" y="294" text-anchor="middle">published only if it scores better</text>
  <line class="wire" x1="332" y1="282" x2="262" y2="282"/>
  <path class="wire" d="M 86 252 L 86 84"/>

  <rect class="zone" x="8" y="112" width="300" height="112"/>
  <text class="sm" x="24" y="132">short-term memory</text>
  <text class="sm" x="24" y="156">the 12-example window: fast, forgetful,</text>
  <text class="sm" x="24" y="174">and today built from the AI's own words</text>
  <text class="sm" x="24" y="192">rather than the ticket — fixed in step 2.</text>
</svg>
