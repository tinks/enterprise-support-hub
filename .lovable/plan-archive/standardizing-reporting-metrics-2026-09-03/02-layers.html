<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--foreground)); }
    .lbl { font-size: 14px; font-weight: 480; }
    .note { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .mono { font-family: var(--font-mono); font-size: 11px; fill: hsl(var(--muted-foreground)); }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
    .acc { fill: none; stroke: hsl(var(--accent)); stroke-width: 1; }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="box" x="16" y="20" width="150" height="54" rx="8"/>
  <text class="lbl" x="91" y="42" text-anchor="middle">Ticket rows</text>
  <text class="mono" x="91" y="60" text-anchor="middle">intercom_tickets_v3</text>

  <rect class="zone" x="200" y="8" width="424" height="140" rx="8"/>
  <text class="note" x="212" y="26">shared library — canonical definitions</text>

  <rect class="acc" x="216" y="38" width="180" height="46" rx="8"/>
  <text class="lbl" x="306" y="60" text-anchor="middle">population</text>
  <text class="note" x="306" y="76" text-anchor="middle">exclusions + plan scope</text>

  <rect class="acc" x="416" y="38" width="190" height="46" rx="8"/>
  <text class="lbl" x="511" y="60" text-anchor="middle">responsiveness</text>
  <text class="note" x="511" y="76" text-anchor="middle">triage · human first reply</text>

  <rect class="acc" x="216" y="96" width="390" height="42" rx="8"/>
  <text class="lbl" x="411" y="118" text-anchor="middle">resolution — four-way persisted clock</text>
  <text class="note" x="240" y="118">active / wait / eng / closed</text>

  <line class="wire" x1="166" y1="47" x2="208" y2="47" marker-end="url(#a)"/>

  <line class="wire" x1="410" y1="148" x2="410" y2="190" marker-end="url(#a)"/>

  <rect class="box" x="16" y="200" width="140" height="48" rx="8"/>
  <text class="lbl" x="86" y="222" text-anchor="middle">SLA family</text>
  <text class="note" x="86" y="238" text-anchor="middle">report · dashboard · bench</text>

  <rect class="box" x="172" y="200" width="140" height="48" rx="8"/>
  <text class="lbl" x="242" y="222" text-anchor="middle">Analytics v3</text>
  <text class="note" x="242" y="238" text-anchor="middle">trend · monthly lookback</text>

  <rect class="box" x="328" y="200" width="140" height="48" rx="8"/>
  <text class="lbl" x="398" y="222" text-anchor="middle">Resolution anatomy</text>
  <text class="note" x="398" y="238" text-anchor="middle">customer report</text>

  <rect class="box" x="484" y="200" width="140" height="48" rx="8"/>
  <text class="lbl" x="554" y="222" text-anchor="middle">Owner dashboards</text>
  <text class="note" x="554" y="238" text-anchor="middle">currently raw — worst drift</text>

  <line class="wire" x1="86" y1="190" x2="86" y2="198"/>
  <line class="wire" x1="242" y1="190" x2="242" y2="198"/>
  <line class="wire" x1="398" y1="190" x2="398" y2="198"/>
  <line class="wire" x1="554" y1="190" x2="554" y2="198"/>
  <line class="wire" x1="86" y1="190" x2="554" y2="190"/>

  <circle cx="28" cy="288" r="9" fill="hsl(var(--accent))"/>
  <text x="28" y="292" text-anchor="middle" font-size="11" fill="hsl(var(--accent-foreground))">1</text>
  <text class="note" x="46" y="292">Every surface imports the same three definitions — no page recomputes a metric locally.</text>

  <circle cx="28" cy="318" r="9" fill="hsl(var(--accent))"/>
  <text x="28" y="322" text-anchor="middle" font-size="11" fill="hsl(var(--accent-foreground))">2</text>
  <text class="note" x="46" y="322">Triage and human-first-reply are computed once in the sync path and persisted, so month-scale pages stay cheap.</text>

  <circle cx="28" cy="348" r="9" fill="hsl(var(--accent))"/>
  <text x="28" y="352" text-anchor="middle" font-size="11" fill="hsl(var(--accent-foreground))">3</text>
  <text class="note" x="46" y="352">Raw time_to_resolve_s is demoted to a labelled wall-clock secondary; it is never the headline.</text>
</svg>
