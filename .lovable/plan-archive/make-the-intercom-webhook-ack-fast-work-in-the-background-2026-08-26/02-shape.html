<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Current versus proposed webhook request shape">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--foreground)); }
    .lbl { font-size: 14px; font-weight: 480; }
    .note { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .rail { stroke: hsl(var(--border)); stroke-width: 1; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
    .acc { stroke: hsl(var(--accent)); stroke-width: 1; fill: none; }
    .accf { fill: hsl(var(--accent)); }
    .quiet { fill: hsl(var(--muted)); stroke: none; }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <text class="note" x="8" y="20">today</text>
  <line class="rail" x1="8" y1="30" x2="632" y2="30"/>
  <rect class="quiet" x="60" y="46" width="430" height="34" rx="8"/>
  <rect class="box" x="60" y="46" width="430" height="34" rx="8"/>
  <text class="lbl" x="275" y="68" text-anchor="middle">verify, Supabase reads, Intercom fetch, Gmail match, Slack post</text>
  <text class="note" x="8" y="68">Intercom</text>
  <line class="wire" x1="42" y1="63" x2="56" y2="63" marker-end="url(#a)"/>
  <line class="wire" x1="490" y1="63" x2="560" y2="63" marker-end="url(#a)"/>
  <text class="note" x="566" y="60">200</text>
  <text class="note" x="566" y="76">or 504</text>
  <text class="note" x="60" y="98">response held for the whole chain — one slow call times out the delivery</text>

  <text class="note" x="8" y="150">proposed</text>
  <line class="rail" x1="8" y1="160" x2="632" y2="160"/>
  <rect class="acc" x="60" y="176" width="150" height="34" rx="8"/>
  <text class="lbl" x="135" y="198" text-anchor="middle">verify + claim</text>
  <text class="note" x="8" y="198">Intercom</text>
  <line class="wire" x1="42" y1="193" x2="56" y2="193" marker-end="url(#a)"/>
  <line class="acc" x1="210" y1="193" x2="278" y2="193" marker-end="url(#a)"/>
  <circle class="accf" cx="292" cy="193" r="9"/>
  <text x="292" y="197" text-anchor="middle" font-size="11" fill="hsl(var(--accent-foreground))">1</text>
  <text class="note" x="306" y="197">200 immediately</text>

  <rect class="box" x="60" y="228" width="430" height="34" rx="8" stroke-dasharray="4 3"/>
  <text class="lbl" x="275" y="250" text-anchor="middle">waitUntil: Intercom fetch, Gmail match, Slack post, writes</text>
  <line class="wire" x1="135" y1="210" x2="135" y2="224" marker-end="url(#a)"/>
  <text class="note" x="500" y="250">failures logged,</text>
  <text class="note" x="500" y="264">not retried by Intercom</text>
</svg>
