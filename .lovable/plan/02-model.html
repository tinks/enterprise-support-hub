<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--foreground)); }
    .lbl { font-size: 14px; font-weight: 480; }
    .note { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .mono { font-family: var(--font-mono); font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
    .accentbox { fill: none; stroke: hsl(var(--accent)); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ch" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <text class="lbl" x="16" y="22">Who can do what</text>

  <rect class="box" x="16" y="44" width="150" height="56" rx="8"/>
  <text class="lbl" x="32" y="70">Signed in, no role</text>
  <text class="note" x="32" y="88">CSM by default</text>

  <rect class="box" x="16" y="120" width="150" height="56" rx="8"/>
  <text class="lbl" x="32" y="146">editor</text>
  <text class="note" x="32" y="164">support engineers</text>

  <rect class="box" x="16" y="196" width="150" height="56" rx="8"/>
  <text class="lbl" x="32" y="222">admin</text>
  <text class="note" x="32" y="240">settings, users, policy</text>

  <line class="wire" x1="166" y1="72" x2="270" y2="72" marker-end="url(#ch)"/>
  <line class="wire" x1="166" y1="148" x2="270" y2="148" marker-end="url(#ch)"/>
  <line class="wire" x1="166" y1="224" x2="270" y2="224" marker-end="url(#ch)"/>

  <rect class="box" x="278" y="44" width="160" height="56" rx="8"/>
  <text class="lbl" x="294" y="70">read</text>
  <text class="note" x="294" y="88">reports, analytics, inbox</text>

  <rect class="accentbox" x="278" y="120" width="160" height="56" rx="8"/>
  <text class="lbl" x="294" y="146">read + write</text>
  <text class="note" x="294" y="164">tickets, notes, registry</text>

  <rect class="box" x="278" y="196" width="160" height="56" rx="8"/>
  <text class="lbl" x="294" y="222">read + write + admin</text>
  <text class="note" x="294" y="240">roles, access, SLA policy</text>

  <rect class="zone" x="464" y="44" width="160" height="208" rx="8"/>
  <text class="note" x="480" y="66">enforced in three places</text>
  <text class="mono" x="480" y="98">RLS: has_role(uid,</text>
  <text class="mono" x="480" y="114">'editor') or admin</text>
  <text class="mono" x="480" y="146">edge fn: 403 for</text>
  <text class="mono" x="480" y="162">non-editors</text>
  <text class="mono" x="480" y="194">UI: useCanEdit()</text>
  <text class="mono" x="480" y="210">hides controls</text>
  <text class="note" x="480" y="240">cron paths unaffected</text>
</svg>
