<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .lbl { font-size: 14px; font-weight: 480; fill: hsl(var(--foreground)); }
    .mono { font-family: var(--font-mono); font-size: 11px; }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
    .rail { stroke: hsl(var(--border)); stroke-width: 1; }
    .quiet { fill: hsl(var(--muted)); }
    .acc { fill: hsl(var(--accent)); }
    .accs { fill: none; stroke: hsl(var(--accent)); stroke-width: 1; }
    .accf { fill: hsl(var(--accent-foreground)); font-size: 11px; }
  </style>

  <text class="lbl" x="0" y="14">Shared IssueTable — one column contract</text>

  <!-- header row -->
  <rect class="quiet" x="0" y="28" width="640" height="24" rx="4"/>
  <text x="10" y="44" class="mono">Intercom ID</text>
  <text x="96" y="44">Subject</text>
  <text x="236" y="44">Contact</text>
  <text x="318" y="44">Customer</text>
  <text x="400" y="44">Owner</text>
  <text x="462" y="44">view-specific …</text>
  <text x="590" y="44">Age</text>

  <!-- rows -->
  <g>
    <rect class="box" x="0" y="56" width="640" height="26" rx="8"/>
    <rect class="accs" x="8" y="62" width="74" height="14" rx="7"/>
    <text class="mono" x="14" y="73" fill="hsl(var(--accent))">2041…9 ↗</text>
    <rect class="quiet" x="96" y="65" width="120" height="8" rx="4"/>
    <rect class="quiet" x="236" y="65" width="66" height="8" rx="4"/>
    <rect class="quiet" x="318" y="65" width="60" height="8" rx="4"/>
    <rect class="quiet" x="400" y="65" width="44" height="8" rx="4"/>
    <rect class="quiet" x="462" y="65" width="110" height="8" rx="4"/>
    <rect class="quiet" x="590" y="65" width="38" height="8" rx="4"/>
  </g>
  <g>
    <rect class="box" x="0" y="86" width="640" height="26" rx="8"/>
    <rect class="accs" x="8" y="92" width="74" height="14" rx="7"/>
    <text class="mono" x="14" y="103" fill="hsl(var(--accent))">2038…4 ↗</text>
    <rect class="quiet" x="96" y="95" width="96" height="8" rx="4"/>
    <rect class="quiet" x="236" y="95" width="66" height="8" rx="4"/>
    <rect class="quiet" x="318" y="95" width="52" height="8" rx="4"/>
    <rect class="quiet" x="400" y="95" width="44" height="8" rx="4"/>
    <rect class="quiet" x="462" y="95" width="90" height="8" rx="4"/>
    <rect class="quiet" x="590" y="95" width="30" height="8" rx="4"/>
  </g>

  <!-- pins -->
  <circle class="acc" cx="44" cy="130" r="9"/><text class="accf" x="41" y="134">1</text>
  <text x="60" y="134">canonical ID chip: links to Intercom, never opens the sheet</text>
  <circle class="acc" cx="44" cy="154" r="9"/><text class="accf" x="41" y="158">2</text>
  <text x="60" y="158">row click opens the read-only detail sheet on every view</text>
  <circle class="acc" cx="44" cy="178" r="9"/><text class="accf" x="41" y="182">3</text>
  <text x="60" y="182">grade lives in row tint + Age pill, not in a leftmost column</text>

  <!-- per-view slots -->
  <rect class="zone" x="0" y="200" width="640" height="90" rx="8"/>
  <text x="12" y="218">view-specific slot</text>
  <rect class="box" x="12" y="226" width="146" height="24" rx="8"/><text x="24" y="242">Inbox v3</text>
  <text x="24" y="262" font-size="11">area · class · state · RSA · CSAT</text>
  <rect class="box" x="170" y="226" width="146" height="24" rx="8"/><text x="182" y="242">Triage</text>
  <text x="182" y="262" font-size="11">business age · anchor</text>
  <rect class="box" x="328" y="226" width="146" height="24" rx="8"/><text x="340" y="242">Escalations</text>
  <text x="340" y="262" font-size="11">type · Linear · hub state · note</text>
  <rect class="box" x="486" y="226" width="142" height="24" rx="8"/><text x="498" y="242">Prospects</text>
  <text x="498" y="262" font-size="11">domain · area · status</text>
</svg>
