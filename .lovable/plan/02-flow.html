<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="100%" style="font-family: var(--font-sans);">
  <style>
    .lbl { font-size: 14px; font-weight: 480; fill: hsl(var(--foreground)); }
    .sub { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
    .tag { font-size: 12px; fill: hsl(var(--border)); }
    .pin { fill: hsl(var(--accent)); }
    .pintx { font-size: 11px; font-weight: 600; fill: hsl(var(--accent-foreground)); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="zone" x="8" y="20" width="180" height="120" rx="8"/>
  <text class="tag" x="18" y="38">source project — untouched</text>
  <rect class="box" x="28" y="52" width="140" height="64" rx="8"/>
  <text class="lbl" x="98" y="80" text-anchor="middle">Support Hub</text>
  <text class="sub" x="98" y="98" text-anchor="middle">real data stays here</text>

  <line class="wire" x1="188" y1="84" x2="232" y2="84" marker-end="url(#ar)"/>
  <text class="sub" x="210" y="74" text-anchor="middle" style="paint-order: stroke; stroke: hsl(var(--background)); stroke-width: 3px;">remix</text>

  <rect class="zone" x="236" y="20" width="248" height="260" rx="8"/>
  <text class="tag" x="246" y="38">demo remix</text>

  <rect class="box" x="256" y="52" width="208" height="40" rx="8"/>
  <text class="lbl" x="360" y="77" text-anchor="middle">Wipe real data</text>

  <rect class="box" x="256" y="106" width="208" height="40" rx="8"/>
  <text class="lbl" x="360" y="131" text-anchor="middle">Seed fictional dataset</text>

  <rect class="box" x="256" y="160" width="208" height="40" rx="8"/>
  <text class="lbl" x="360" y="185" text-anchor="middle">Mock connectors, genericize</text>

  <rect class="box" x="256" y="214" width="208" height="40" rx="8"/>
  <text class="lbl" x="360" y="232" text-anchor="middle">Presenter overlay + reset</text>
  <text class="sub" x="360" y="248" text-anchor="middle">one click back to seeded state</text>

  <line class="wire" x1="360" y1="92" x2="360" y2="102" marker-end="url(#ar)"/>
  <line class="wire" x1="360" y1="146" x2="360" y2="156" marker-end="url(#ar)"/>
  <line class="wire" x1="360" y1="200" x2="360" y2="210" marker-end="url(#ar)"/>

  <line class="wire" x1="484" y1="234" x2="524" y2="234" marker-end="url(#ar)"/>

  <rect class="box" x="528" y="196" width="104" height="76" rx="8"/>
  <text class="lbl" x="580" y="228" text-anchor="middle">Audit gate</text>
  <text class="sub" x="580" y="246" text-anchor="middle">then publish</text>
  <circle class="pin" cx="612" cy="212" r="9"/>
  <text class="pintx" x="612" y="216" text-anchor="middle">1</text>
  <text class="sub" x="528" y="120">1 — leak greps, seed/reset</text>
  <text class="sub" x="528" y="138">round trip, and a click</text>
  <text class="sub" x="528" y="156">through every demo route</text>
  <text class="sub" x="528" y="174">at ultrawide width</text>
</svg>
