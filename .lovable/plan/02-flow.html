<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Workspace identity access flow">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--foreground)); }
    .lbl { font-size: 14px; font-weight: 480; }
    .note { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .acc { fill: none; stroke: hsl(var(--accent)); stroke-width: 1; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
    .zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="chev" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="box" x="20" y="52" width="150" height="60" rx="8"/>
  <text class="lbl" x="95" y="78" text-anchor="middle">Lovable workspace</text>
  <text class="note" x="95" y="96" text-anchor="middle">member, @lovable.dev</text>

  <line class="wire" x1="170" y1="82" x2="222" y2="82" marker-end="url(#chev)"/>

  <rect class="acc" x="226" y="52" width="170" height="60" rx="8"/>
  <text class="lbl" x="311" y="78" text-anchor="middle">Hub reads identity</text>
  <text class="note" x="311" y="96" text-anchor="middle">no login page</text>

  <line class="wire" x1="396" y1="82" x2="448" y2="82" marker-end="url(#chev)"/>

  <rect class="box" x="452" y="52" width="168" height="60" rx="8"/>
  <text class="lbl" x="536" y="78" text-anchor="middle">Hub user record</text>
  <text class="note" x="536" y="96" text-anchor="middle">created on first visit</text>

  <line class="wire" x1="536" y1="112" x2="536" y2="168" marker-end="url(#chev)"/>

  <rect class="zone" x="196" y="172" width="424" height="98" rx="8"/>
  <text class="note" x="208" y="192">access card (settings, admin only)</text>

  <rect class="box" x="216" y="202" width="180" height="50" rx="8"/>
  <text class="lbl" x="306" y="232" text-anchor="middle">Grant / revoke admin</text>

  <rect class="box" x="416" y="202" width="184" height="50" rx="8"/>
  <text class="lbl" x="508" y="226" text-anchor="middle">Block person</text>
  <text class="note" x="508" y="243" text-anchor="middle">refused even if in workspace</text>

  <text class="note" x="95" y="200">self-signup</text>
  <text class="note" x="95" y="218">stays closed</text>
</svg>
